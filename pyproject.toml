[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elohim"
version = "0.4.0"
description = "A gate for numerical claims: every published number pinned to a checksum, instrument tampering caught before a result is trusted."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Present on PyPI's sidebar, and its absence was visible: a package with no
# `authors` renders with nobody to contact, which for a tool whose whole claim is
# that it can be audited is the wrong first impression.
authors = [{ name = "Kiliaan Vanvoorden" }]
keywords = ["evaluation", "verification", "reproducibility", "claims", "gate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # The interpreter range is this project's central claim and it is measured,
    # not asserted: `skills/reproducibility` holds every sibling shard to the
    # interpreter it was pinned under, and `ci.yml` runs 3.10 through 3.14 on
    # every push. Declaring `>=3.10` and then listing only `:: 3` left the
    # metadata contradicting the thing the package is for. Each minor below is
    # one CI's `core` job has actually run green.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
elohim = "elohim_gate.cli:main"

[project.urls]
Homepage = "https://github.com/BoozeLee/elohim"
Source = "https://github.com/BoozeLee/elohim"
Issues = "https://github.com/BoozeLee/elohim/issues"

# Pinned, not ranged. A ranged pin is a measurement that changes when someone
# else pushes, which is the failure this repository exists to catch. These are
# the versions the tree was last checked against, recorded 2026-10-02.
[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.0.3",
    "ruff==0.15.13",
]

[tool.hatch.build.targets.wheel]
packages = ["elohim_gate"]

# The instruments and their ledger.json files ship as package data. The gate
# locates that tree with skills_root() -- the packaged copy first, then a checkout,
# refusing loudly and naming every candidate -- so the installed copy runs anywhere.
# tools/verify_wheel.py is the gate for that claim: it builds this artifact,
# installs it into a clean venv, and calls the library from outside the checkout.
# It used to be false for the API, which is what `pip install elohim` is for.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "elohim_gate/_skills"
"adapters" = "elohim_gate/_adapters"
"plugins" = "elohim_gate/_plugins"