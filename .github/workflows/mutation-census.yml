name: Mutation Census

# Nightly, not per-PR, and the reason is measured rather than preferred.
#
# The full population is 1679 (operator x site) pairs and is finite, so it is
# enumerated rather than sampled. The sampled arm is NOT a substitute: N=200
# reads 0.2686 against a population of 0.0375, because 200 draws reach only 47
# (operator x skill) cells and always take site #1 of each. That is structural
# bias, not noise, so it does not converge on the population rate as N grows.
# A per-PR job on the sample would gate a number that is not the quantity it
# names.
#
# Nightly rather than per-PR for the other reason: every one of the 63
# surviving mutations has been individually explained in
# docs/MUTATION_SURVIVAL.md. Re-proving that on every push is ten minutes of
# runner time to learn nothing that has changed.
on:
  schedule:
    # 03:17 UTC. An off-round minute on purpose: every workflow scheduled at
    # :00 queues behind the same wave, and this one runs 1679 subprocesses.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fail_over:
        description: "Survival rate above which the run fails. Empty means the absolute-gap mode."
        required: false
        type: string

permissions:
  contents: read

# No cancel-in-progress. A run that is 10 minutes in is most of the way through
# the population; cancelling it to start a newer one wastes the work and leaves
# no record. Two nights overlapping for a few minutes is cheaper than that.
concurrency:
  group: mutation-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    # The population is 1679 mutations at a 45s per-mutation budget each.
    # Measured 600s wall on 12 cores; a GitHub runner has 4, so jobs defaults
    # to 2 and the run is roughly 3x that. The cap is set well above the
    # expected time rather than at it, because a timeout here produces no
    # verdict and would read as "no regression found".
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # 3.13, deliberately. The threshold below was measured on 3.13.13,
          # and estimator-bias's shard provably changes class at the CPython
          # 3.12 sum() boundary. Running the gate on an interpreter the
          # threshold was not measured on would make a drift in the
          # interpreter look like a change in the ledgers.
          python-version: "3.13"

      - name: the census, against the whole population
        run: |
          args=""
          if [ -n "${{ inputs.fail_over }}" ]; then
            args="--fail-over ${{ inputs.fail_over }}"
          else
            args="--fail-over 0.05"
          fi
          # -m, not a path to tools/census.py: the census now lives inside the
          # elohim_gate package, so `tools/census.py` no longer exists. There is no
          # install step above, so python -m resolves against the checkout via cwd
          # on sys.path -- which is what a nightly gate wants. It also means this job
          # measures the committed tree, never an installed copy that could differ.
          python3 -m elohim_gate.census \
            --seed 1 \
            --limit 0 \
            --jobs 2 \
            --out census-report.json \
            $args

      - name: the report is published either way
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-census-report
          path: census-report.json
          retention-days: 30

      # The report is uploaded unconditionally on purpose. Under --fail-over
      # the accepted survivors are the recorded gap, not a regression, and the
      # only way to see them is to open the artifact. A job that goes green
      # with 63 survivors hidden behind the exit code is the failure mode this
      # step exists to prevent.
      - name: name the surviving mutations
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          p = pathlib.Path("census-report.json")
          if not p.exists():
              raise SystemExit("census-report.json is absent: the run died before it could write one")
          d = json.loads(p.read_text())
          s = d["summary"]
          cov = s["coverage"]
          if "threshold" not in d:
              raise SystemExit(
                  f"census-report.json has no threshold block, so it was not written "
                  f"by the census.py in this tree (schema {d.get('schema')}). This is "
                  f"version skew, not a measurement: refuse to report a gated rate "
                  f"the report does not carry.")
          t = d["threshold"]

          # What this guards is not a crash. census.py exiting non-zero fails
          # the job, and an empty run fails on its own inside verdict(). The
          # silent failure is a refactor that stops ENUMERATING part of the
          # population: that yields a SHORTER run with FEWER survivors, so the
          # rate goes down, the gate goes GREEN, and the only symptom is a
          # smaller number in this log. A gate that goes green on less evidence
          # than it went green on last time is the one outcome it must never
          # report, so the population is pinned from outside the run.
          #
          # Both facts below used to be literals in this file -- the number 1679
          # and a six-skill list -- which is two more copies of things the tree
          # already decides, and the skill list was stale the moment
          # claim-ledger and pay-signal landed: the nightly would have failed on
          # its own list rather than on anything about the census. The skill set
          # is now derived from the ledgers, which is also what makes
          # elohim-harness's absence structural rather than a name somebody
          # remembered to leave out: it ships no ledger, so it cannot appear.
          EXPECTED_SKILLS = sorted(
              p.parent.name for p in pathlib.Path("skills").glob("*/ledger.json"))
          if not EXPECTED_SKILLS:
              raise SystemExit(
                  "no ledger-bearing skill was found under skills/, so the expected "
                  "set is empty and every comparison below would pass vacuously.")
          got = sorted(d.get("skills") or [])
          if got != EXPECTED_SKILLS:
              raise SystemExit(
                  f"the census covered {got}, not {EXPECTED_SKILLS}. elohim-harness "
                  f"is deliberately absent from that list: it is the harness, not an "
                  f"instrument, and it carries no ledger. A different set means some "
                  f"instruments were not found, so every number below is measured on "
                  f"a population that is not this one.")
          if cov["forged_sites_attempted"] != cov["population_sites"]:
              raise SystemExit(
                  f"the census attempted {cov['forged_sites_attempted']} of "
                  f"{cov['population_sites']} sites: the population was not covered.")

          # The figures this run is measured against are read from the one
          # document that records them, docs/MUTATION_SURVIVAL.md, which holds
          # a "recorded figures" table for exactly this purpose. Every one of
          # them used to be a literal in this file -- 1679, a six-skill list,
          # 9f26bde149ed0526, 63, 1598 -- and all five were stale the moment
          # claim-ledger and pay-signal landed, so the nightly would have failed
          # on its own copies of the answers rather than on anything about the
          # census. One home, read from here.
          #
          # A changed population is a fact a human owes a reading, so nothing
          # below self-updates. The table is edited by hand, after a
          # measurement, and editing it wrongly is what claim_binding catches
          # from the other side by re-deriving the population from the tree.
          DOC = pathlib.Path("docs/MUTATION_SURVIVAL.md")
          if not DOC.is_file():
              raise SystemExit(f"{DOC} is absent, so there is nothing to measure against")
          doc_text = DOC.read_text(encoding="utf-8")
          RECORDED = {}
          for _name, _value in re.findall(
                  r"^\| (population sites|defect-arm effective|defect-arm reported|"
                  r"defect-arm n|survivor identity digest) \| ([^|]+?) \|$",
                  doc_text, re.MULTILINE):
              if _name in RECORDED:
                  raise SystemExit(
                      f"{DOC} records {_name!r} more than once, so the figure it "
                      f"states cannot be read unambiguously")
              RECORDED[_name] = _value.strip().replace(",", "")
          missing = {"population sites", "defect-arm effective", "defect-arm reported",
                     "defect-arm n", "survivor identity digest"} - set(RECORDED)
          if missing:
              raise SystemExit(
                  f"{DOC} no longer records {sorted(missing)}, so the census has "
                  f"nothing to be measured against. A gate that stops pinning is "
                  f"not a gate that passed.")
          EXPECTED_POPULATION = int(RECORDED["population sites"])

          if cov["population_sites"] != EXPECTED_POPULATION:
              raise SystemExit(
                  f"the census enumerated {cov['population_sites']} sites, not the "
                  f"{EXPECTED_POPULATION} docs/MUTATION_SURVIVAL.md records this tree "
                  f"as having. Adding a site is the only legitimate way to move it, "
                  f"and that should turn the nightly red until a human looks, because "
                  f"a changed population is a fact a human owes a reading.")

          # The three checks above prove the census ENUMERATED everything. None
          # of them can see which sites it then concluded survive. A stale
          # import, a module shadowed by sys.path[0], or a classification that
          # moved produces a full, complete, entirely plausible report about the
          # wrong sites -- which is the one failure this repository has already
          # shipped, in a different costume: a gate that measures nothing at all
          # and reports success.
          #
          # So the survivors are pinned by IDENTITY, not by count. Counting is
          # not enough: 63 survivors is equally consistent with the right 63 and
          # with 63 different ones. site_index identifies a site and survives
          # being moved between files; lineno deliberately does not enter the
          # digest, because it moves whenever an unrelated edit shifts a line,
          # and a pin that fires on unrelated edits is a pin that gets ignored.
          # Read from the recorded-figures table above, for the reasons given
          # there: as literals they were three more stale copies of the answer.
          EXPECTED_ROWS_DIGEST = RECORDED["survivor identity digest"]
          EXPECTED_EFFECTIVE = int(RECORDED["defect-arm effective"])
          EXPECTED_DEFECT_ARM_N = int(RECORDED["defect-arm n"])

          rows = [r for r in d["rows"] if r.get("arm") == "forged" and r.get("outcome") == "EFFECTIVE"]
          ident = sorted((r["operator"], r["skill"], r["site_index"]) for r in rows)
          digest = hashlib.sha256(
              "\n".join("|".join(map(str, i)) for i in ident).encode()
          ).hexdigest()[:16]
          if digest != EXPECTED_ROWS_DIGEST:
              raise SystemExit(
                  f"the {len(rows)} surviving sites are not the recorded ones: digest "
                  f"{digest}, expected {EXPECTED_ROWS_DIGEST}. Every number above was "
                  f"measured, the population was covered, and the report is well "
                  f"formed -- it is about the wrong sites. The recorded survivors are "
                  f"in docs/MUTATION_SURVIVAL.md; pinning another fact legitimately "
                  f"removes one, and that should turn the nightly red until a human "
                  f"confirms it, exactly as changing the population does.")
          if t["defect_arm"]["effective"] != EXPECTED_EFFECTIVE or t["defect_arm"]["n"] != EXPECTED_DEFECT_ARM_N:
              raise SystemExit(
                  f"the gated rate is {t['rate_measured']} over "
                  f"{t['defect_arm']['effective']}/{t['defect_arm']['n']}, not the "
                  f"recorded {EXPECTED_EFFECTIVE}/{EXPECTED_DEFECT_ARM_N}, even though "
                  f"the surviving sites matched. The rate and the sites are pinned "
                  f"separately because they can move apart.")
          # REPORTED is pinned too, and it is pinned SEPARATELY from EFFECTIVE
          # because that is the whole point of it: a shard moving in fields the
          # gate does not decide on is a different claim from the gate deciding
          # something new, and a census that checked one and not the other would
          # be checking whichever it happened to print. A drop here is a skill
          # that stopped reporting evidence, which is a real change to the shard
          # and deserves the same human read.
          #
          # Read from `defect_arm_total`, NOT from `forged`: the inert class is
          # excluded from the gated rate for a stated reason, and comparing a
          # defect-arm figure against a forged-arm one is the same unit error
          # that made this check red on its own first run.
          got_reported = s["defect_arm_total"]["REPORTED"]
          want_reported = int(RECORDED["defect-arm reported"])
          if got_reported != want_reported:
              raise SystemExit(
                  f"{got_reported} mutants moved only fields the gate does not decide "
                  f"on; {DOC} records {want_reported}, both on the defect arm. The "
                  f"reported count is not the gated rate, but it is this document's "
                  f"other headline, and it moving without a human reading is how a "
                  f"shard quietly stops publishing what it used to.")

          print(f"population {cov['population_sites']}, attempted {cov['forged_sites_attempted']}")
          print(f"GATED defect-arm rate {t['rate_measured']} "
                f"({t['defect_arm']['effective']}/{t['defect_arm']['n']}) against threshold {t['fail_over']}")
          print(f"not gated: forged rate including inert {t['forged_including_inert']} "
                f"-- {t['basis']}")
          print(f"equivalent {s['forged']['EQUIVALENT']} of {s['forged']['n']} -- no gate can catch these")
          print(f"effective survivors {len(rows)} -- digest {digest}, the recorded ones")
          for r in rows:
              print(f"  {r['operator']} {r['skill']} site {r['site_index']} (line {r['lineno']})")
          PY