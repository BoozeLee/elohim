name: Action

# The Action is a shipped artifact, so CI runs it the way a caller runs it.
#
# `tests/test_all.py` reads action.yml as text: it asserts ten load-bearing
# strings are present and that every embedded Python block compiles. That catches
# a malformed manifest and a syntax error in the namer, and nothing else. A
# manifest can be perfectly well-formed and still be an Action that installs the
# wrong thing, resolves the wrong tree, or reports success having measured
# nothing -- every one of which this repository has shipped once already, in a
# different costume. So something has to execute the steps.
#
# The layout is the point. This repository is checked out into a SUBdirectory, so
# the workspace root holds no checkout of it, and a synthetic caller tree is
# assembled at the workspace root holding the six instrument skills and not the
# harness. The Action then measures that tree while its instrument code arrives
# as an installed distribution. That is the arrangement the whole seam exists to
# support, and it is the only arrangement in which running the Action proves
# anything: checked out at the root, the run would pass whether or not the seam
# worked.
#
# Push to main rather than pull_request, and only on paths the Action reads. The
# Action installs elohim from `git+...@<ref>`, so the ref has to exist on the
# remote; a pull_request's github.sha is a merge commit that has never been
# pushed, and pointing the Action at it would fail in the install step for a
# reason that has nothing to do with the Action. Pull requests are covered by the
# text assertions above, which need no network; the executed path is proven on
# the commits where it would actually ship.

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - pyproject.toml
      - elohim_gate/**
      - skills/**
      - .github/workflows/action.yml
  workflow_dispatch:
    inputs:
      fail_over:
        description: "Survival rate above which the run fails. Empty means the absolute-gap mode."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runs-the-action:
    runs-on: ubuntu-latest
    # Well above the expected time rather than at it, for the reason
    # .github/workflows/mutation-census.yml records: a timeout here produces no
    # verdict, and "no verdict" reads exactly like "nothing is wrong". The whole
    # population is every (operator x site) pair in the tree -- derived, and
    # recorded in docs/MUTATION_SURVIVAL.md rather than written here; a GitHub
    # runner has 4 cores,
    # jobs defaults to 2, and the nightly measured 600s on 12.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Not the workspace root. See the header.
          path: instrument

      - name: assemble a caller tree that holds no checkout of this repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/skills"
          # Everything except the harness: elohim-harness is the instrument's
          # own code, and shipping it in the measured tree would let
          # skills_root() find a harness by walking up from the installed
          # package instead -- which is the substitution the seam was written
          # to refuse, and which would make this job pass without the seam.
          for d in instrument/skills/*/; do
            name="$(basename "$d")"
            if [ "$name" = "elohim-harness" ]; then
              continue
            fi
            cp -R "$d" "${GITHUB_WORKSPACE}/skills/${name}"
          done
          skills="$(find "${GITHUB_WORKSPACE}/skills" -maxdepth 2 -name ledger.json | wc -l)"
          echo "caller tree holds ${skills} ledger(s) and no harness:"
          ls "${GITHUB_WORKSPACE}/skills"
          if [ -d "${GITHUB_WORKSPACE}/skills/elohim-harness" ]; then
            echo "::error::the caller tree carries a harness, so this run cannot" >&2
            echo "::error::prove the seam resolves instrument code from the install" >&2
            exit 1
          fi

          # The positive half of the same claim, which the check above does not
          # make. "Holds no checkout of this repository" is satisfied by a tree
          # holding nothing at all, and a tree quietly missing a skill still has
          # no harness, so that check stayed green on a caller tree carrying
          # five of the six skills. Measured: widening the exclusion above to
          # also skip `elohim` left this step at exit 0 with 5 of 6 skills
          # present. The census then runs against a population smaller than the
          # one the Action reports, and the smaller number is published as the
          # rate -- the defect census.py already shipped here, in which a
          # dropped __main__ guard made the module print nothing and exit 0.
          #
          # Compared by name, not by count, for the same reason the population
          # gates compare denominators: a count agrees just as happily for a
          # tree that gained a skill and lost another.
          expected=""
          for d in instrument/skills/*/; do
            name="$(basename "$d")"
            if [ "$name" = "elohim-harness" ]; then
              continue
            fi
            expected="${expected} ${name}"
          done
          # Globs expand sorted, so this is ordered the same way as `expected`.
          # On an empty tree the glob does not expand at all and `basename`
          # yields the pattern itself, which matches nothing in `expected` --
          # so the empty case fails here rather than comparing "" to "".
          actual=""
          for d in "${GITHUB_WORKSPACE}"/skills/*/; do
            actual="${actual} $(basename "$d")"
          done
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::the caller tree does not hold the instrument skills," >&2
            echo "::error::so the census below measures a population this job" >&2
            echo "::error::does not claim to measure." >&2
            echo "::error::expected: ${expected}" >&2
            echo "::error::actual:   ${actual}" >&2
            exit 1
          fi
          echo "caller tree holds every instrument skill except the harness:"

      # The negative control, and it runs first because it is cheap and a
      # control that cannot fail is not a control. Naming a skill the tree does
      # not hold must refuse rather than skip: a census that silently measured
      # one fewer skill than it was asked about is the exact failure this
      # repository shipped in census.py when a dropped __main__ guard made the
      # module import cleanly, exit 0, print nothing and write no report.
      #
      # `uses: ./instrument`, not `uses: ./`. This is the workflow's second
      # never-executed defect, found on the run above: `uses: ./` resolves at
      # the WORKSPACE ROOT, and the header's whole design is that the workspace
      # root holds no checkout of this repository. The two are incompatible, and
      # the failure is immediate and unambiguous:
      #
      #   Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under
      #   '/home/runner/work/elohim/elohim'. Did you forget to run
      #   actions/checkout before running your local action?
      #
      # The fix is one path segment and it does not weaken the seam. A local
      # action reference only decides where the Action's OWN manifest is read
      # from; `ELOHIM_TREE` is `${{ github.workspace }}`, which is unaffected and
      # still points at the synthetic caller tree holding six skills and no
      # harness. What is measured and what supplies the instrument code are still
      # two different places, which is the entire claim this job exists to test.
      # The instrument code still arrives as an installed distribution from
      # `git+...@<ref>`, never read out of `instrument/`.
      - name: the Action refuses a skill this tree does not hold
        id: refusal
        continue-on-error: true
        uses: ./instrument
        with:
          ref: ${{ github.sha }}
          skills: not-a-skill-this-tree-holds

      - name: the refusal was a refusal, not a pass
        run: |
          set -euo pipefail
          if [ "${{ steps.refusal.outcome }}" != "failure" ]; then
            echo "::error::the Action reported success for a tree holding no such" >&2
            echo "::error::skill. A caller naming a skill it does not have would" >&2
            echo "::error::read a green run as a clean measurement." >&2
            exit 1
          fi
          echo "the Action refused a skill its tree does not hold, as it must"

      - name: the census, through the Action, on a tree with no checkout of this one
        id: census
        uses: ./instrument
        with:
          ref: ${{ github.sha }}
          fail-over: ${{ inputs.fail_over || '0.05' }}

      # This step was named as an assertion and asserted nothing. It echoed the
      # Action's five outputs and exited 0, so the first run in the repository's
      # history reported five blank lines, named no population, and went green --
      # while the Action underneath it had measured 1,679 sites and written a
      # report. An echo is not a check: a value that is empty because the wiring is
      # broken is indistinguishable from a value that is empty because the census
      # found nothing, and only one of those is a passing run.
      #
      # So each value is required to be non-empty, and `population-sites` is
      # required to be the number the report itself carries, which is a claim the
      # caller can check rather than a value the caller has to trust.
      - name: the Action named a population and refused nothing
        run: |
          set -euo pipefail
          sites="${{ steps.census.outputs.population-sites }}"
          rate="${{ steps.census.outputs.rate }}"
          effective="${{ steps.census.outputs.effective }}"
          decided="${{ steps.census.outputs.decided }}"
          survivors="${{ steps.census.outputs.survivors }}"

          for pair in "population-sites:${sites}" "rate:${rate}" \
                      "effective:${effective}" "decided:${decided}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "${value}" ]; then
              echo "::error::the Action reported an empty ${name}. A composite" >&2
              echo "::error::action only propagates an output that declares a" >&2
              echo "::error::\`value:\`, so an empty one here means the wiring is" >&2
              echo "::error::broken -- not that the census found nothing." >&2
              exit 1
            fi
          done

          # Cross-check the propagated number against the report artifact, rather
          # than only checking that a number arrived. A count that is present,
          # plausible, and wrong is the failure mode a value-only check misses.
          report="${{ steps.census.outputs.report }}"
          if [ -z "${report}" ] || [ ! -f "${report}" ]; then
            echo "::error::the Action reported no report file (got '${report}')" >&2
            exit 1
          fi
          from_report="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["population_sites"])' "${report}")"
          if [ "${from_report}" != "${sites}" ]; then
            echo "::error::the Action propagated population-sites=${sites} but" >&2
            echo "::error::its own report says ${from_report}." >&2
            exit 1
          fi

          echo "population-sites: ${sites}"
          echo "defect-arm rate:  ${rate}"
          echo "effective:        ${effective}"
          echo "decided:          ${decided}"
          echo "survivors:"
          printf '%s\n' "${survivors}"