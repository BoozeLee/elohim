name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One pytest pin for this workflow, referenced by every job below. `test_pins.py`
# requires exactly one `"pytest=="` string per file, so two jobs cannot each spell
# the pin out -- they have to read it from here. That is a constraint the test
# already enforced on one job; a second job is what turned it into a constraint on
# the file. The value stays quoted because that quoting is what the test's regex
# matches on, and `"$PYTEST_PIN"` in a `run:` block deliberately does not match it.
env:
  PYTEST_PIN: "pytest==9.0.3"

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor install.sh declares. 3.14 is current. Every pinned
        # value must read identically on both, or the pin is measuring the
        # interpreter rather than the mathematics.
        #
        # 3.12 sits in the middle because it is the measured boundary, not a
        # round number: sum() became Neumaier compensated summation there and
        # estimator-bias's shard changes class at exactly that version. The
        # reproducibility gate pins both classes, so a matrix that only ran the
        # two ends exercised one of them and would have missed a third.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: shipped text is clean
        run: python3 tools/check_text.py

      - name: derived mirrors are byte-identical
        run: python3 tools/sync_adapters.py --check

      - name: every gated skill is green
        run: python3 tests/test_all.py

      - name: claim sentences are bound to pinned values
        run: python3 skills/elohim-harness/scripts/claim_binding.py --root .

      # The repository's own state, and the only gate here that asks the
      # network a question. `--require-visibility` is the point of running it
      # here and not in the unit suite: on a runner GITHUB_TOKEN exists, so
      # "I could not check whether the repository is public" is a failure
      # rather than a shrug. Locally the same command without the flag reports
      # it as UNVERIFIED and still refuses to call that a pass.
      #
      # This step exists because `docs/DISTRIBUTION.md` once carried a blocking
      # claim that main and origin/main had diverged, and nothing re-measured
      # it. The claim was true when written and false for months; a gate that
      # had existed would have said so on the first push after it stopped
      # being true.
      - name: the repository's own state is re-measured
        run: python3 tools/verify_repo_state.py --require-visibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The 43-test unit suite, and the reason this step exists: until it was
      # added, pytest was wired to nothing. Every gate above reported rc=0 at a
      # point in this repository's history while pytest had a genuine failure,
      # because a case had been added to tests/test_all.py's list but not to
      # tests/test_gate_suite.py's own. That file guards the gate case list, and
      # this step is the only thing that runs it.
      #
      # It goes last so that if the install fails the four gates have already
      # run and reported their own results. It is not continue-on-error: a layer
      # whose failures are tolerated is not optional, it is unmonitored.
      #
      # The pin is written here as well as in pyproject.toml. That is a second
      # place to move, deliberately: `pip install --group` needs pip >= 25.1,
      # which the 3.10 leg of this matrix cannot promise, and tomllib does not
      # exist on 3.10 either, so the pin cannot be read from the one canonical
      # table. The two must move together.
      #
      # It is spelled once for the whole file and read from `env` here and in
      # `unit-stress`, because `tests/test_pins.py` requires exactly one
      # `"pytest=="` string per file and a second job is what made that a
      # constraint on this file rather than on this step.
      - name: install the unit-test runner
        run: python3 -m pip install --disable-pip-version-check "$PYTEST_PIN"

      - name: the unit suite is green
        run: python3 -m pytest -q

  # A separate job, not a fifth step above. That is the whole point: Core CI
  # cannot read skills/elohim/artifacts/, so deleting artifacts/ together with
  # tools/verify_published.py leaves the four gates above byte-for-byte the
  # four gates that shipped. Folding this in would have made the optionality a
  # promise instead of a mechanism.
  #
  # continue-on-error is deliberately absent. An optional layer whose failures
  # are tolerated is not optional, it is unmonitored.
  published-shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: the published shard matches its manifest
        run: python3 tools/verify_published.py

  # The third job, for the same reason the second is a separate job: adding a
  # step to `core` would make this gate part of the thing every PR waits on, and
  # it does not belong in that unit. Building a wheel and installing it into a
  # fresh venv costs far more than the four steps above, so it runs here, in
  # parallel, on its own runner. Wall-clock cost to a PR is therefore about
  # zero, which is what makes it affordable to run on every push rather than on
  # release day.
  #
  # What it checks is a sentence in pyproject.toml that was false: "The gate
  # resolves everything from Path(__file__), so the installed copy runs anywhere."
  # True of the console script, false of the Python API -- seven reads went
  # straight to REPO / "skills", which inside a wheel is site-packages/skills,
  # a directory that does not exist. `pip install elohim` is the distribution
  # form E3 depends on, and an external caller is the only thing that closes
  # E1's third clause, so the check is: build the artifact, install it, call the
  # API from outside the checkout.
  #
  # continue-on-error is deliberately absent, for the same reason as above. A
  # layer whose failures are tolerated is not optional, it is unmonitored -- and
  # this one is not optional anyway, since a wheel that cannot find its own
  # package data is a release that raises FileNotFoundError on first use.
  #
  # 3.14 only, and that is a real limit rather than a rounding. The matrix in
  # `core` spans 3.10 to 3.14 because the mathematics moves across that range.
  # What this job checks is a directory layout, which does not vary by
  # interpreter version, so a second leg would cost a minute to re-measure the
  # same force-include mapping. What it therefore does NOT prove: that the wheel
  # installs and runs on 3.10, which pyproject declares as its floor. That is an
  # open gap, stated here so nobody reads this job as having closed it.
  #
  # Both pins live here and nowhere else. build invokes the backend declared in
  # pyproject.toml, and --no-isolation means that backend must already be
  # importable here -- so hatchling is pinned by this job rather than resolved
  # from pyproject's `requires = ["hatchling"]`. That is deliberate in both
  # directions: this job's wheel is then built by a recorded version rather than
  # by whatever was newest, while pyproject stays unpinned because it describes
  # the backend for anyone installing the package, which is a different
  # question from reproducing one build. They cannot drift against each other
  # because one of them names no version.
  #
  # Two questions, then, and neither is the other's. The first is what the job
  # already asked: does this checkout build an installable artifact at all? The
  # second is the one publish.yml asks, and until this job asked it too, nothing
  # did -- the same tool in its `--dist` mode, pointed at an artifact rather than
  # asked to make one, which is the invocation the publish gate uses. Those two
  # are not the same question: a gate that builds its own wheel has verified a
  # second build of the same checkout, so the first can be green while the
  # artifact on its way to the index is unverified. publish.yml is the only
  # other place that asks the second question, and this repository has already had
  # two workflows that had never executed and were both defective. So it is asked
  # here, on every push, where a failure is free.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: install the wheel builder
        run: >-
          python3 -m pip install --disable-pip-version-check
          "build==1.5.0" "hatchling==1.32.4"

      - name: the installed wheel runs the API
        run: python3 tools/verify_wheel.py

      # The same tool, pointed at an artifact instead of asked to build one --
      # the invocation publish.yml makes, run on every push rather than on the
      # first real publish. Until this step existed, a `--dist` mode that refused
      # everything and a `--dist` mode that worked were identical in every test
      # in this repository, and the only thing that could tell them apart was a
      # publish to a public index.
      #
      # `--no-isolation` so the backend is the hatchling this job pinned two steps
      # up rather than whatever is newest on PyPI -- build installs nothing in
      # that mode and checks the dependency is already present instead, which is
      # the trade the pins above were written for. It changes where the backend
      # comes from, not what gets built: with no --sdist/--wheel flag this still
      # writes the sdist *and* the wheel, so the gate is pointed at the same
      # two-artifact directory it will meet in publish.yml. The gate reads the
      # wheel out of it and the sdist beside it, which is the limit publish.yml's
      # own comment states out loud.
      - name: build into the directory the publish gate reads
        run: python3 -m build --no-isolation --outdir dist/

      - name: the artifact in dist/ installs and its API runs
        run: python3 tools/verify_wheel.py --dist dist/

  # The fourth job. It exists because a single run per push cannot see
  # nondeterminism, which is a real class and invisible by construction -- but the
  # red that prompted it turned out NOT to be that class, and writing otherwise
  # here would be the exact defect this repository exists to catch.
  #
  # What was actually observed: a local unit-suite run went red, a re-run at the
  # same commit passed, and CI passed on both commits involved. The cause is
  # `tests/test_gate_suite.py::test_the_script_has_a_case_for_every_name_it_names`,
  # which reads `tests/test_all.py` from disk at test time and asserts that the
  # `def case_*` functions on disk equal the ones `CASES` declares. Another agent
  # session was editing that file in a shared working tree, so the two views
  # disagreed mid-edit. A clean detached checkout of the same commit is green. The
  # suite was never nondeterministic; the tree it reads was moving underneath it.
  #
  # So this job cannot catch that, and it would be wrong to read it as if it could.
  # CI checks out a clean committed tree, where those two views agree by
  # construction. That failure class is local to a working tree and no CI job can
  # observe it. The suite size is the same story one level up: the collected count
  # moved when a test was added to a file in that tree.
  #
  # What it does cover is the class that SURVIVES a clean checkout: timing,
  # randomness, filesystem ordering, anything depending on state a run leaves
  # behind. A single run genuinely cannot see that, which is what makes the job
  # worth its wall clock. It runs the suite repeatedly and stops at the first
  # failure.
  #
  # It is a separate job rather than a fifth step in `core` for the reasons the
  # other two are: `core` is a matrix over three interpreter versions, so a
  # repeat count there is three times the wall clock for the same information,
  # and `core` goes last-then-first in a way that makes an intermittent red
  # indistinguishable from an install failure. One leg, 3.14, is where the red
  # was actually observed.
  #
  # Six is a budget, not a derivation. If the per-run failure rate is p, then
  # six independent runs detect a failure with probability 1 - (1 - p)**6, and
  # that is the whole honest claim: this job multiplies the chance per push of
  # getting a name instead of a shrug. p is not written here on purpose. One run
  # went red and four passed at the same commit, which bounds p somewhere under a
  # fifth and does not pin it, and a number in this file that a later run
  # invalidates is the exact defect this repository keeps finding in its own
  # documents. Measure p before quoting it; plug it into the expression above.
  #
  # Read the consequence plainly: this job is a detector, not a fix, and a green
  # run is NOT evidence that the suite is clean. Raise the count when the suite
  # is fast enough to afford it; lower it knowing the probability falls with it.
  #
  # continue-on-error is deliberately absent, and this is the case where that
  # costs something real: a genuinely intermittent suite will make this job red
  # on a push where nothing is wrong, and red-on-nothing is how a team learns to
  # ignore red. That is the trade being made. The alternative -- tolerating the
  # failure -- is the failure this repository treats as worse than having no
  # control at all, because an unmonitored layer is not optional, it is
  # unmonitored. If this job goes red intermittently and nobody can name a test,
  # the honest response is to fix the suite, not to add continue-on-error.
  #
  # `-rf` is not decoration. The one time this was observed locally the failing
  # test name was destroyed by a `tail -1`, and a run that cannot name its
  # failure cannot be diagnosed. If you add a tail to this step, keep the FAILED
  # lines.
  #
  # What it does NOT cover: `tests/test_all.py` is not collected by pytest -- it
  # parses Python with `ast` and is run as a script by `core` -- so this job
  # repeats the same 46 cases from three files that `core` runs, and nothing
  # else. It is a stress job, not a second, wider gate.
  unit-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # Reads the pin from the file-level `env` rather than spelling it out again.
      # `tests/test_pins.py` requires exactly one `"pytest=="` string per file,
      # and an earlier draft of this step wrote the pin out a second time and
      # carried a comment arguing that was better -- which is precisely the kind
      # of claim this repository exists to catch, and the pin gate caught it. The
      # duplication `test_pins.py` guards is between this file and pyproject.toml,
      # which cannot be merged on the matrix's 3.10 leg; two jobs inside this file
      # can be, and now are.
      - name: install the unit-test runner
        run: python3 -m pip install --disable-pip-version-check "$PYTEST_PIN"

      - name: the unit suite is green six times in a row
        run: |
          set -u
          runs=6
          for i in $(seq 1 "$runs"); do
            echo "=== run $i of $runs ==="
            if python3 -m pytest -q -rf; then
              echo "=== run $i: rc=0 ==="
            else
              rc=$?
              echo "=== run $i: rc=$rc -- stopping. The FAILED lines above name the test; keep them. ==="
              exit "$rc"
            fi
          done
          echo "=== $runs of $runs green ==="
