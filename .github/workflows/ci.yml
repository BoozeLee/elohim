name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor install.sh declares. 3.14 is current. Every pinned
        # value must read identically on both, or the pin is measuring the
        # interpreter rather than the mathematics.
        #
        # 3.12 sits in the middle because it is the measured boundary, not a
        # round number: sum() became Neumaier compensated summation there and
        # estimator-bias's shard changes class at exactly that version. The
        # reproducibility gate pins both classes, so a matrix that only ran the
        # two ends exercised one of them and would have missed a third.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: shipped text is clean
        run: python3 tools/check_text.py

      - name: derived mirrors are byte-identical
        run: python3 tools/sync_adapters.py --check

      - name: every gated skill is green
        run: python3 tests/test_all.py

      - name: claim sentences are bound to pinned values
        run: python3 skills/elohim-harness/scripts/claim_binding.py --root .

      # The 43-test unit suite, and the reason this step exists: until it was
      # added, pytest was wired to nothing. Every gate above reported rc=0 at a
      # point in this repository's history while pytest had a genuine failure,
      # because a case had been added to tests/test_all.py's list but not to
      # tests/test_gate_suite.py's own. That file guards the gate case list, and
      # this step is the only thing that runs it.
      #
      # It goes last so that if the install fails the four gates have already
      # run and reported their own results. It is not continue-on-error: a layer
      # whose failures are tolerated is not optional, it is unmonitored.
      #
      # The pin is written here as well as in pyproject.toml. That is a second
      # place to move, deliberately: `pip install --group` needs pip >= 25.1,
      # which the 3.10 leg of this matrix cannot promise, and tomllib does not
      # exist on 3.10 either, so the pin cannot be read from the one canonical
      # table. The two must move together.
      - name: install the unit-test runner
        run: python3 -m pip install --disable-pip-version-check "pytest==9.0.3"

      - name: the unit suite is green
        run: python3 -m pytest -q

  # A separate job, not a fifth step above. That is the whole point: Core CI
  # cannot read skills/elohim/artifacts/, so deleting artifacts/ together with
  # tools/verify_published.py leaves the four gates above byte-for-byte the
  # four gates that shipped. Folding this in would have made the optionality a
  # promise instead of a mechanism.
  #
  # continue-on-error is deliberately absent. An optional layer whose failures
  # are tolerated is not optional, it is unmonitored.
  published-shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: the published shard matches its manifest
        run: python3 tools/verify_published.py
