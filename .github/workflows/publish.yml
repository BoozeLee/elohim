# Publish to PyPI — by hand, never by tag

# This exists because PyPI Trusted Publishing's security model requires it, and
# saying that is the whole reason this file is here rather than a design choice.
#
# Trusted Publishing works by PyPI trusting ONE workflow file, on ONE repository,
# on ONE branch, optionally inside ONE named environment. There is no other
# mechanism: a long-lived API token is the alternative, and a token is a
# credential that outlives the thing it was issued for. So a publish workflow is
# not optional infrastructure for this mode -- it IS the trust boundary. The
# earlier planning round was wrong to say Trusted Publishing "needs no such
# workflow", and it was wrong in a way only a measurement could have caught:
# there was no publish workflow in the tree to be configured against.
#
# What this deliberately is NOT, because a build-on-tag workflow was declined at
# 0.29 and that decline still stands:
#
#   * It does not run on a tag push. `on:` is `workflow_dispatch` and nothing
#     else. Pushing v0.3.0 publishes nothing.
#   * It does not decide the version. The version comes from `pyproject.toml`,
#     which a human edits.
#   * It does not decide that a release happens. A human runs it.
#
# So the earlier reasoning holds in the form it was meant to: publishing is a
# human decision about WHAT to release, and this workflow is CI executing a
# decision already made rather than making one. The refusal was to automation
# choosing the moment, not to CI existing.
#
# The `environment` line is load-bearing and is the one thing a human must get
# right on the PyPI side. An environment is what stops a workflow on a feature
# branch from publishing, because a run must be approved for that environment
# first. It is named `pypi`; the trusted publisher on PyPI must name the same
# string or every publish fails at upload with an opaque OIDC error.

name: Publish to PyPI

on:
  # Only this. A tag push publishes nothing, and that is the point.
  workflow_dispatch:
    inputs:
      # `type: boolean` is load-bearing, not decoration. Without it
      # `${{ inputs.dry_run }}` is the *string* "false", which is truthy, and the
      # flag inverts: a dry run would upload. `tests/test_package_metadata.py`
      # asserts the type, because a `dry_run` that cannot be turned on is worse
      # than none -- it looks like a safety control.
      dry_run:
        description: "Build and verify without uploading. Set this on the first run."
        type: boolean
        default: false

# `contents: read` matches every other workflow in this repository.
# `id-token: write` is what mints the OIDC token PyPI exchanges for a
# short-lived upload credential. It is the entire basis of the trust, and it is
# why no secret is stored anywhere: a leak of this repository's CI cannot mint a
# PyPI credential, because minting one requires a real run of this file on the
# protected branch inside the `pypi` environment.
permissions:
  contents: read
  id-token: write

# One job. A publish is a single irreversible act, and splitting it across jobs
# would mean a partial release: built but not uploaded, or uploaded but not
# verified.
jobs:
  publish:
    runs-on: ubuntu-latest
    # See the note above. A run must be approved for this environment, which is
    # what makes a feature-branch workflow unable to publish.
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 3.14 only, and for the same reason the `wheel` job in ci.yml is 3.14
      # only: this is a packaging operation, and the directory layout it produces
      # does not vary by interpreter. The mathematics is what varies across
      # 3.10-3.14, and `ci.yml`'s `core` job is what measures that.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: install the wheel builder
        run: >-
          python3 -m pip install --disable-pip-version-check
          "build==1.5.0" "hatchling==1.32.4"

      # The same two pins as the `wheel` job in ci.yml, deliberately. They are
      # duplicated rather than read from a table because a workflow cannot
      # import a value from another workflow, and because a pin that drifts
      # between the job that proves the artifact and the job that uploads it
      # proves it for one build and ships another.
      - name: build the distribution
        run: python3 -m build --outdir dist/

      # `pyproject.toml` is edited by a person, and the index does not replace
      # a released version. So a dispatch offering a version that is already
      # published cannot succeed, and without this step it fails at the upload:
      # after the build, after the token exchange, having established nothing
      # except the number to bump. `elohim` 0.3.0 is released, which makes that
      # the state this repository is actually in.
      #
      # It asks the JSON API and never the web page, because the web page
      # answers HTTP 200 for names that do not exist. `docs/PUBLISHING.md`
      # records that trap and both ways a check written against it comes out
      # backwards.
      #
      # A step of its own rather than an `if:` on the upload, for the reason the
      # `if:` below gives: a dry run must still do the work. A guard that only
      # runs when it matters is a guard nobody has ever watched pass.
      - name: the version being offered is not already released
        run: python3 tools/verify_release_slot.py

      # The upload succeeding is not the same as the artifact being installable,
      # and only the second is what anyone consumes. This step is the second, and
      # it sits above the upload rather than below it: a packaging defect found
      # after the upload is a defect the public index is already serving, and a
      # published version is not withdrawn by publishing a fixed one next to it.
      # The earlier this gate turns red, the cheaper the lesson.
      #
      # What it proves, stated exactly rather than generously. `--dist dist/`
      # makes it install the wheel the build step above already produced and
      # upload nothing itself, so what it checks is the artifact this run is
      # about to send rather than a second build of the same checkout. What it
      # does not check is the bytes as the index received them -- nothing in
      # this workflow does -- and the step is named for what it does rather than
      # for what it hoped to check, because the version of this comment that
      # said "published" was false.
      #
      # The `wheel` job in ci.yml runs the same tool with no `--dist`, on
      # purpose. That job asks whether the checkout builds an installable
      # artifact; this one asks whether the artifact about to leave is
      # installable. Neither question is the other's.
      - name: the wheel about to be uploaded installs and its API runs
        run: python3 tools/verify_wheel.py --dist dist/

      # v1.14.2. The sha is the commit the annotated tag v1.14.2 resolves to,
      # dereferenced rather than copied from the tag object, so it names code
      # rather than a name that can be moved.
      #
      # The `if:` is on this step and not on the job, so a dry run still builds,
      # still installs, and still verifies -- it simply does not upload. A dry run
      # that skips the work is not a dry run; it is a workflow that reported
      # success without having checked anything.
      #
      # It exists because of a measured pattern rather than a precaution: two
      # workflows in this repository had never executed and both were defective,
      # one in 12 seconds and one in 8, and every one of them looked correct in
      # review. This is the first workflow here whose first *successful* run
      # writes to a public index, which is the most expensive place to learn that
      # lesson.
      - name: publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
