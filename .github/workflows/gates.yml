name: Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      # One entry point, and it is the same one a developer runs by hand. If CI
      # listed the gates itself the two lists would drift, and the local copy
      # would stop being evidence of anything.
      #
      - name: run the skill gates
        run: ./scripts/run-skill-gates.sh
