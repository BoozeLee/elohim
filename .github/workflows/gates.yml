name: Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # One entry point, and it is the same one a developer runs by hand. If CI
      # listed the gates itself the two lists would drift, and the local copy
      # would stop being evidence of anything.
      #
      # `verify_skill_roots` is expected to FAIL here and in ci.yml, because all
      # nine skills are reachable from both skills/ and plugins/elohim/skills/.
      # That is the gate looking rather than a regression -- see PROJECT_ROOTS in
      # tools/verify_skill_roots.py. It is left red deliberately: a green that
      # means "inspected nothing" is the failure this family of gates exists to
      # prevent, and whether the mirror is intentional is an open question about
      # this repository's layout.
      - name: run the skill gates
        run: ./scripts/run-skill-gates.sh
